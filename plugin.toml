id = "nc.jslt"
name = "JSLT"
version = "0.1.5"
description = "JSLT 文件高亮、补全、语法检查、定义跳转、悬停说明与缩进格式化。需另行安装 Node.js 20+ 语言服务；首次使用提供安装与授权引导。"
authors = ["Nc"]
license = "Apache-2.0"
categories = ["languages"]
engines.openidea = "^1.5"
wasm = "dist/plugin.wasm"
activation = ["on-language:jslt", "on-command:nc.jslt.check", "on-command:nc.jslt.setup"]

[[contributes.languages]]
path = "languages/jslt.toml"

[[contributes.commands]]
id = "nc.jslt.check"
title = "JSLT: Check language server / 检查语言服务"

[[contributes.commands]]
id = "nc.jslt.setup"
title = "JSLT: Installation and permissions / 安装与授权说明"
