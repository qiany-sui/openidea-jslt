name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt
      - run: npm --prefix server ci --ignore-scripts --registry https://registry.npmjs.org
      - run: cargo fmt --package openidea-jslt --check
      - run: cargo test --locked
      - run: npm run build
      - run: npm test
      - name: Check with OpenIDEA 0.1.43
        run: |
          curl --fail --location --output "$RUNNER_TEMP/openidea-plugin.gz" https://github.com/l0ng-ai/openidea/releases/download/v0.1.43/openidea-plugin-linux-x86_64.gz
          echo 'f6d00115444670c8e3e8ef61c6aacabfa3924fda382a78b633fac1064cae1caa  '"$RUNNER_TEMP/openidea-plugin.gz" | sha256sum --check
          gzip --decompress "$RUNNER_TEMP/openidea-plugin.gz"
          chmod +x "$RUNNER_TEMP/openidea-plugin"
          "$RUNNER_TEMP/openidea-plugin" check dist/nc.jslt-0.1.3.oiplugin
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            dist/*.oiplugin
            dist/*.tgz
            dist/SHA256SUMS
